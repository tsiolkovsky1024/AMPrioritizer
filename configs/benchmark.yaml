# Compact benchmark family (AMP / species / MIC heads only).
# Reference configuration of the frozen predictor (LambdaRank weight 0.5);
# the reported models use seeds 2 and 3. See docs/HYPERPARAMETERS.md.
seed: 2
model_family: stripped
mixed_precision: fp16
grad_accum: 2
hf_cache_dir: .hf_cache
out_dir: runs/benchmark
data:
  data_dir: data/current
  max_len: 200
  active_threshold_log10: 1.5
  neg_fasta: data/negatives/AMPlify_non_AMP_train_imbalanced.fa
  neg_log10_mic: 3.91
model:
  name: facebook/esm2_t33_650M_UR50D
  finetune_mode: full
  head_hidden: 512
  head_dropout: 0.3
  gradient_checkpointing: true
  species_encoder:
    type: kmer_mlp
    kmer_features_path: data/current/species_kmer_features.npz
    mlp_hidden: 512
train:
  epochs: 5
  per_device_batch_size: 8
  num_workers: 4
  lr_backbone: 1.0e-05
  lr_head: 0.0001
  wd: 0.01
  warmup_ratio: 0.05
  alpha_species: 0.5
  alpha_censored: 0.3
  censor_event_multiplier: 1.0
  alpha_huber_active: 0.5
  alpha_lambda: 0.5
  alpha_listmle: 0.2
  rank_loss_type: gap_pairwise
  rank_min_gap_log10: 0.0
  rank_ndcg_k: 50
  listmle_top_weighted: false
  label_smoothing: 0.2
  huber_delta: 1.0
  grad_clip: 1.0
  log_every: 20
  eval_every: 500
  save_last: false
selection_protocol:
  split: validation
  test_used_for_selection: false
  tuning_validation_floor: 0.48
  tuning_min_anchor_gain: 0.005
  confirmation_top_k: 3
  guardrails:
    max_mae_delta: 0.03
    max_censoring_drop: 0.03
    max_amp_auroc_drop: 0.005
    max_amp_auprc_drop: 0.01
    max_amp_f1_drop: 0.01
    max_hemo_mae_delta: 0.05
